services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aprendevest
      POSTGRES_PASSWORD: aprendevest
      POSTGRES_USER: aprendevest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aprendevest -d aprendevest"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
